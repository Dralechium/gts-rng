
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTS RNG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #168CF0;
  --green: #83B66B;
  --yellow: #F5E500;
  --bg: #080E1B;
  --panel: #101A2D;
  --panel-light: #15233A;
  --border: #293950;
  --muted: #A2B0C5;

  --gradient: linear-gradient(
    110deg,
    var(--blue) 0%,
    var(--green) 52%,
    var(--yellow) 100%
  );

  --gradient-soft: linear-gradient(
    110deg,
    #168CF01C 0%,
    #83B66B1C 52%,
    #F5E5001C 100%
  );

  --gradient-glow:
    0 0 18px #168CF01A,
    0 0 24px #83B66B12,
    0 0 30px #F5E5000D;
}

* {
  box-sizing: border-box;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  color: #FFFFFF;
  background:
    radial-gradient(ellipse at 0% 0%, #168CF016 0%, transparent 42%),
    radial-gradient(ellipse at 100% 0%, #F5E5000C 0%, transparent 38%),
    radial-gradient(ellipse at 50% 100%, #83B66B0B 0%, transparent 48%),
    var(--bg);
  background-attachment: fixed;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    opacity .2s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

.hidden {
  display: none !important;
}

/* HEADER */

.header {
  position: relative;
  padding: 18px 24px;
  background:
    linear-gradient(110deg, #168CF00A, #83B66B08, #F5E50008),
    #0B1323;
  border-bottom: 1px solid transparent;
  border-image: var(--gradient) 1;
}

.headerLayout {
  width: min(1500px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 20px;
}

.headerStats {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  min-width: 0;
}

.headerStat {
  min-width: 105px;
  padding: 9px 13px;
  background: #111C2F;
  border: 1px solid #293950;
  border-radius: 10px;
}

.headerStatLabel {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.headerStatValue {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  color: #FFFFFF;
  overflow-wrap: anywhere;
}

.headerTitle {
  text-align: center;
  min-width: 0;
}

.header h1 {
  margin: 0;
  font-size: clamp(25px, 3vw, 38px);
  font-weight: 900;
  letter-spacing: 1px;
  background: var(--gradient);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 12px #168CF02A);
  white-space: nowrap;
}

.headerSubtitle {
  margin-top: 5px;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
}

#accountBar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  min-width: 0;
}

#accountText {
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: #FFFFFF;
}

.accountIndicator {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 9px #83B66B66;
}

/* BUTTONS */

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
}

.primary {
  color: #07111D;
  background: var(--gradient);
  box-shadow: var(--gradient-glow);
}

.primary:hover:not(:disabled) {
  box-shadow:
    0 0 18px #168CF055,
    0 0 25px #83B66B22,
    0 0 28px #F5E50022;
}

.secondary {
  color: #FFFFFF;
  background: #18243A;
  border: 1px solid #34445B;
}

.secondary:hover:not(:disabled) {
  background: var(--gradient-soft);
  border-color: #6C9E9A;
}

#logoutButton {
  padding: 10px 15px;
  color: #07111D;
  font-size: 12px;
}

/* NAVIGATION */

.nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  padding: 20px 12px;
}

.nav button {
  position: relative;
  padding: 11px 20px;
  color: #C3CDDC;
  background: #101A2D;
  border: 1px solid #293950;
}

.nav button.active {
  color: #FFFFFF;
  background: var(--gradient-soft);
  border-color: #5C9BB4;
  box-shadow: 0 0 16px #168CF014;
}

/* MAIN CONTENT */

main {
  width: min(1100px, 100%);
  margin: auto;
  padding: 10px 20px 45px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.page h2 {
  font-size: 21px;
  margin: 12px 0 20px;
  background: var(--gradient);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

/* ROLL DISPLAY */

.roll-area {
  text-align: center;
}

#display {
  position: relative;
  width: min(380px, 100%);
  min-height: 275px;
  margin: 20px auto;
  padding: 25px 15px;
  background:
    linear-gradient(145deg, #15243B, #0D1628),
    var(--panel);
  border: 1px solid transparent;
  border-radius: 18px;
  background-clip: padding-box;
  outline: 1px solid #34465A;
  outline-offset: -1px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 13px;
  box-shadow: var(--gradient-glow);
  transition: box-shadow .25s ease;
}


/* Rarity-specific roll display effects */

#display.common {
  outline: 1px solid #888888;
  background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
  box-shadow: 0 0 15px #888888;
}

#display.rare {
  outline: 1px solid #4da6ff;
  background: linear-gradient(145deg, #0b1a2a, #123a66);
  box-shadow: 0 0 20px #4da6ff;
}

#display.epic {
  outline: 1px solid #b84dff;
  background: linear-gradient(145deg, #1a0b2a, #3a1266);
  box-shadow: 0 0 25px #b84dff;
}

#display.legendary {
  outline: 1px solid gold;
  background: linear-gradient(145deg, #2a220b, #665012);
  box-shadow: 0 0 30px gold;
}

#display.mythic {
  outline: 1px solid red;
  background: linear-gradient(145deg, #2a0b0b, #661212);
  box-shadow: 0 0 40px red;
}

#display.gts {
  outline: 2px solid transparent;
  border: 2px solid transparent;
  background:
    linear-gradient(
      135deg,
      #168CF0 0%,
      #83B66B 50%,
      #F5E500 100%
    ) padding-box,
    linear-gradient(
      135deg,
      #168CF0,
      #83B66B,
      #F5E500
    ) border-box;
  box-shadow:
    0 0 22px #168CF0,
    0 0 35px #83B66B88,
    0 0 45px #F5E50055;
}

#resultImage {
  width: 112px;
  height: 112px;
  object-fit: cover;
  border-radius: 50%;
  background: #202D44;
  border: 2px solid transparent;
  outline: 2px solid #34465A;
  box-shadow:
    0 0 12px #168CF022,
    0 0 16px #83B66B16;
}

#name {
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 900;
  overflow-wrap: anywhere;
}

#odds {
  color: #FFFFFF;
  font-size: 16px;
  font-weight: 800;
}

#rollButton {
  min-width: 220px;
  padding: 17px 30px;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 2px;
}

#autoButton {
  margin: 10px;
}

#status {
  min-height: 25px;
  margin: 15px 0;
  color: #A6D3A1;
  overflow-wrap: anywhere;
  font-size: 13px;
}

/* INVENTORY */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 13px;
}

.card {
  min-height: 175px;
  text-align: center;
  background:
    linear-gradient(145deg, #142139, #0F192B);
  border: 1px solid #293950;
  border-radius: 13px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  overflow-wrap: anywhere;
  transition: transform .2s, border-color .2s, box-shadow .2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #659A9A;
  box-shadow: var(--gradient-glow);
}

.card img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #34465A;
}

.card.locked img {
  filter: blur(7px) grayscale(1);
}

.lockedText {
  color: var(--muted);
  font-size: 24px;
}


/* Rarity-specific inventory card effects */

.card.common {
  background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
  border-color: #888888;
  box-shadow: 0 0 8px #88888888;
}

.card.rare {
  background: linear-gradient(145deg, #0b1a2a, #123a66);
  border-color: #4da6ff;
  box-shadow: 0 0 12px #4da6ff;
}

.card.epic {
  background: linear-gradient(145deg, #1a0b2a, #3a1266);
  border-color: #b84dff;
  box-shadow: 0 0 18px #b84dff;
}

.card.legendary {
  background: linear-gradient(145deg, #2a220b, #665012);
  border-color: gold;
  box-shadow: 0 0 25px gold;
}

.card.mythic {
  background: linear-gradient(145deg, #2a0b0b, #661212);
  border-color: red;
  box-shadow: 0 0 35px red;
}

.card.gts {
  background: linear-gradient(
    135deg,
    #168CF0 0%,
    #83B66B 50%,
    #F5E500 100%
  );
  border: 1px solid #FFFFFF88;
  box-shadow:
    0 0 15px #168CF0,
    0 0 25px #83B66B88,
    0 0 35px #F5E50066;
}

/* LEADERBOARD */

.table {
  width: 100%;
  border-collapse: collapse;
  background: #101A2D;
  border: 1px solid #293950;
  border-radius: 12px;
  overflow: hidden;
}

.table th,
.table td {
  padding: 14px 8px;
  border-bottom: 1px solid #293950;
  text-align: center;
  overflow-wrap: anywhere;
}

.table th {
  color: #A9CBB1;
  background: var(--gradient-soft);
  font-size: 12px;
}

.table tbody tr:hover {
  background: #168CF00B;
}

.table tbody tr:last-child td {
  border-bottom: 0;
}

/* AUTHENTICATION */

#authPanel {
  width: min(400px, calc(100% - 32px));
  margin: 35px auto;
  padding: 24px;
  background:
    linear-gradient(145deg, #142139, #0E1728);
  border: 1px solid #3B5969;
  border-radius: 16px;
  box-shadow: var(--gradient-glow);
}

#authPanel h2 {
  margin-top: 0;
  font-size: 23px;
  background: var(--gradient);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

#authPanel input {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 13px;
  color: #FFFFFF;
  background: #0A1221;
  border: 1px solid #34445B;
  border-radius: 8px;
  outline: none;
}

#authPanel input:focus {
  border-color: #659A9A;
  box-shadow: 0 0 10px #168CF018;
}

#authPanel input::placeholder {
  color: #8493A9;
}

#submitAuth,
#switchAuth {
  width: 100%;
  margin-top: 9px;
}

#authMessage {
  overflow-wrap: anywhere;
  color: #C7D4E6;
  font-size: 12px;
  line-height: 1.6;
}

/* CUTSCENE */

#cutscene {
  display: none !important;
}

#cutscene.play {
  animation: burst 2.4s ease-in-out;
}

@keyframes burst {
  0% {
    opacity: 0;
    transform: scale(.3);
  }
  20% {
    opacity: 1;
    transform: scale(.7);
  }
  70% {
    opacity: .85;
    transform: scale(1.5);
  }
  100% {
    opacity: 0;
    transform: scale(2.5);
  }
}

#display.rolling {
  animation: flicker .12s linear infinite alternate;
}

@keyframes flicker {
  from {
    transform: translateX(-2px);
    filter: brightness(1.1);
  }
  to {
    transform: translateX(2px);
    filter: brightness(.75);
  }
}

/* RESPONSIVE LAYOUT */

@media (max-width: 850px) {
  .header {
    padding: 16px;
  }

  .headerLayout {
    grid-template-columns: 1fr 1fr;
    row-gap: 15px;
  }

  .headerTitle {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .headerStats {
    grid-column: 1;
    grid-row: 2;
  }

  #accountBar {
    grid-column: 2;
    grid-row: 2;
  }

  .headerStat {
    min-width: 0;
    padding: 8px 10px;
  }

  .headerStatValue {
    font-size: 11px;
  }

  #accountText {
    max-width: 140px;
  }
}

@media (max-width: 520px) {
  .header {
    padding: 14px 10px;
  }

  .headerLayout {
    gap: 12px 6px;
  }

  .header h1 {
    font-size: 28px;
  }

  .headerSubtitle {
    letter-spacing: 2px;
  }

  .headerStats {
    gap: 5px;
  }

  .headerStat {
    padding: 7px;
    border-radius: 8px;
  }

  .headerStatLabel {
    font-size: 8px;
    letter-spacing: .4px;
  }

  .headerStatValue {
    font-size: 10px;
  }

  #accountBar {
    gap: 6px;
  }

  #accountText {
    max-width: 110px;
    font-size: 10px;
  }

  #logoutButton {
    padding: 8px 9px;
    font-size: 10px;
  }

  .nav {
    gap: 5px;
    padding: 16px 5px;
  }

  .nav button {
    padding: 10px 9px;
    font-size: 11px;
  }

  main {
    padding: 8px 12px 35px;
  }

  .grid {
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 9px;
  }

  .table th,
  .table td {
    padding: 10px 4px;
    font-size: 10px;
  }

  #authPanel {
    padding: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

    </section>

    <section id="inventoryPage" class="page">

      <div id="inventory" class="grid"></div>
    </section>

    <section id="leaderboardPage" class="page">
      <h2>Rolls Leaderboard</h2>
      <div id="leaderboard">Loading leaderboard...</div>

  </main>
</div>

  {name:"spaceuk", odds:750000, image:"https://imglink.cc/cdn/paJhVJkdDP.png"},
  {name:"Gamingbyte444", odds:1000000, image:"https://imglink.cc/cdn/eiOPQ0FfH0.png"},
  {name:"sharkifiedgd", odds:1000000, image:"https://imglink.cc/cdn/Oiy2an__LG.png"},
  {name:"twkn9", odds:1000000, image:"https://imglink.cc/cdn/rF8rNZY3vz.png"},
  {name:"theosGMD", odds:1000000, image:"https://imglink.cc/cdn/Nfy6B-QVic.png"}
];

const $ = id => document.getElementById(id);

const secureRandomValues = new Uint32Array(1);
const getSecureRandomValues = crypto.getRandomValues.bind(crypto);

function secureRandom() {
  getSecureRandomValues(secureRandomValues);
  return secureRandomValues[0] / 4294967296;
}

let currentUser = null;
let profile = null;
let signupMode = false;
let rolling = false;
let autoRoll = false;
let autoTimer = null;
let pendingSignupUsername = null;

const GUEST_SAVE_KEY = "gtsRngGuestSave";

function emptyProfile(username = "Guest") {
  return {
    username,
    rolls: 0,
    inventory: {},
    bestName: null,
    bestOdds: 0
  };
}

function loadGuestProfile() {
  try {
    const saved = localStorage.getItem(GUEST_SAVE_KEY);

    if (saved) {
      const data = JSON.parse(saved);

      return {
        ...emptyProfile(),
        ...data,
        username: "Guest",
        rolls: Number(data.rolls) || 0,
        inventory: data.inventory || {}
      };
    }
  } catch (error) {
    console.error("Could not load guest save:", error);
  }

  return emptyProfile();
}

function saveGuestProfile() {
  if (currentUser || !profile) return;

  localStorage.setItem(
    GUEST_SAVE_KEY,
    JSON.stringify({
      rolls: profile.rolls || 0,
      inventory: profile.inventory || {}
    })
  );
}

function rarity(odds) {
  if (odds >= 1000000) return "gts";
  if (odds >= 100000) return "mythic";
  if (odds >= 10000) return "legendary";
  if (odds >= 1000) return "epic";
  if (odds >= 100) return "rare";
  return "common";
}

function bestMember() {
  if (!profile) return null;

  return members
    .filter(m => (profile.inventory?.[m.name] || 0) > 0)
    .sort((a, b) => b.odds - a.odds)[0] || null;
}

function updateUI() {
  $("rollCount").textContent = profile?.rolls || 0;

  const best = bestMember();

  $("bestCount").textContent = best
    ? `${best.name} (1/${best.odds})`
    : "None";

  $("accountText").textContent = currentUser
    ? profile?.username || currentUser.email || "Player"
    : "Not logged in";
}

function renderInventory() {
  $("inventory").innerHTML = members.map(m => {
    const count = profile?.inventory?.[m.name] || 0;

    return `<div class="card ${count ? rarity(m.odds) : "locked"}">
      <img src="${escapeHTML(m.image)}" alt="" loading="lazy">
      <strong>${escapeHTML(count ? m.name : "???")}</strong>
      <span>${count ? `1 in ${m.odds.toLocaleString()}` : "Locked"}</span>
      ${count ? `<span>Owned: ${count}</span>` : ""}
    </div>`;
  }).join("");
}

async function saveProfile() {
  if (!currentUser || !profile) return;

  const best = bestMember();

  await setDoc(doc(db, "users", currentUser.uid), {
    username: profile.username,
    rolls: profile.rolls,
    inventory: profile.inventory,
    bestName: best?.name || null,
    bestOdds: best?.odds || 0,
    updatedAt: serverTimestamp()
  });
}

function weightedPick() {
  // Relative weights make rarer cards less likely.
  const total = members.reduce((sum, m) => sum + 1 / m.odds, 0);
  let value = secureRandom() * total;

  for (const m of members) {
    value -= 1 / m.odds;
    if (value <= 0) return m;
  }

  return members[0];
}

function showMember(m, playCutscene = true) {
  $("resultImage").src = m.image;
  $("name").textContent = m.name;
  $("odds").textContent = `1 in ${m.odds.toLocaleString()}`;
  $("display").className = rarity(m.odds);

  if (playCutscene && m.odds >= 100000) {
    $("cutscene").classList.remove("play");
    void $("cutscene").offsetWidth;
    $("cutscene").classList.add("play");
  }
}

const gtsMembers = members.filter(m => m.odds >= 1000000);

const defaultGtsMember =
  gtsMembers[Math.floor(secureRandom() * gtsMembers.length)];

showMember(defaultGtsMember, false);

window.previewCard = function (cardName) {
  if (typeof cardName !== "string" || !cardName.trim()) {
    console.log('Usage: previewCard("theosGMD")');
    return;
  }

  const member = members.find(
    m => m.name.toLowerCase() === cardName.trim().toLowerCase()
  );

  if (!member) {
    console.log(
      `Card "${cardName}" not found. Available cards:`,
      members.map(m => m.name)
    );
    return;
  }

  // Display the card only. Do not roll or modify saved data.
  showMember(member);

  $("status").textContent =
    `Previewing ${member.name} (1 in ${member.odds}) — preview only`;

  console.log(
    `Previewing ${member.name} | 1 in ${member.odds} | Rarity: ${rarity(member.odds)}`
  );
};

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function roll() {
  if (!profile || rolling) return;

  rolling = true;
  $("rollButton").disabled = true;
  $("display").classList.add("rolling");
  $("status").textContent = "Rolling...";

  try {
    const duration = 1800;
    const start = performance.now();
    let nextChange = 0;

    while (performance.now() - start < duration) {
      const elapsed = performance.now() - start;
      const progress = elapsed / duration;

      if (elapsed >= nextChange) {
        showMember(members[Math.floor(secureRandom() * members.length)]);
        nextChange = elapsed + 40 + progress * 180;
      }

      await wait(25);
    }

    const result = weightedPick();

    profile.rolls = (profile.rolls || 0) + 1;
    profile.inventory[result.name] =
      (profile.inventory[result.name] || 0) + 1;

    showMember(result);
    updateUI();
    renderInventory();

    $("status").textContent =
      `You rolled ${result.name}! (1 in ${result.odds})`;

    if (currentUser) {
      await saveProfile();
    } else {
      saveGuestProfile();
    }
  } catch (error) {
    console.error(error);
    $("status").textContent =
      "Save failed. Check your connection and Firebase rules.";
  } finally {
    $("display").classList.remove("rolling");
    rolling = false;
    $("rollButton").disabled = false;

    if (autoRoll && profile) {
      autoTimer = setTimeout(roll, 500);
    }
  }
}

async function loadLeaderboard() {
  const target = $("leaderboard");
  target.textContent = "Loading leaderboard...";

  try {
    const q = query(
      collection(db, "users"),
      orderBy("rolls", "desc"),
      limit(50)
    );

    const snapshot = await getDocs(q);
    const rows = snapshot.docs.map(d => d.data());

    target.innerHTML = `<table class="table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th>Rolls</th>
          <th>Best</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((u, i) => {
          const best = members.find(
            m => m.name === u.bestName
          );

          const bestText = best
            ? `${best.name} (1 in ${best.odds.toLocaleString()})`
            : "None";

          return `<tr>
            <td>${i + 1}</td>
            <td>${escapeHTML(u.username || "Player")}</td>
            <td>${(Number(u.rolls) || 0).toLocaleString()}</td>
            <td>${escapeHTML(bestText)}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
  } catch (error) {
    console.error(error);
    target.textContent =
      "Could not load leaderboard. Please try again.";
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

$("loginButton").addEventListener("click", () => {
  $("authPanel").classList.toggle("hidden");
  $("authMessage").textContent = "";
});

$("switchAuth").addEventListener("click", () => {
  signupMode = !signupMode;

  $("authTitle").textContent = signupMode ? "Sign Up" : "Login";
  $("submitAuth").textContent = signupMode ? "Create Account" : "Login";

  $("switchAuth").textContent = signupMode
    ? "Already registered? Login"
    : "Need an account? Sign up";

  $("usernameInput").classList.toggle("hidden", !signupMode);

  $("passwordInput").autocomplete = signupMode
    ? "new-password"
    : "current-password";

  $("authMessage").textContent = "";
});

$("submitAuth").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;
  const username = $("usernameInput").value.trim();

  $("authMessage").textContent = "Please wait...";
  $("submitAuth").disabled = true;

  try {
    if (signupMode) {
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        throw new Error(
          "Username must be 3–20 letters, numbers, or underscores."
        );
      }

      pendingSignupUsername = username;

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }

    $("authMessage").textContent = "";
  } catch (error) {
    console.error(error);
    $("authMessage").textContent = error.message;
  } finally {
    $("submitAuth").disabled = false;
  }
});

$("logoutButton").addEventListener("click", async () => {
  autoRoll = false;
  clearTimeout(autoTimer);
  $("autoButton").textContent = "AUTOROLL: OFF";

  try {
    await signOut(auth);
  } catch (error) {
    console.error(error);
    $("authMessage").textContent = "Logout failed. Please try again.";
  }
});

$("rollButton").addEventListener("click", roll);

$("autoButton").addEventListener("click", () => {
  autoRoll = !autoRoll;

  $("autoButton").textContent =
    `AUTOROLL: ${autoRoll ? "ON" : "OFF"}`;

  if (autoRoll && !rolling) roll();
  if (!autoRoll) clearTimeout(autoTimer);
});

document.querySelectorAll(".nav button").forEach(button => {
  button.addEventListener("click", async () => {
    document.querySelectorAll(".nav button").forEach(b => {
      b.classList.remove("active");
    });

    document.querySelectorAll(".page").forEach(p => {
      p.classList.remove("active");
    });

    button.classList.add("active");
    $(button.dataset.page).classList.add("active");

    if (button.dataset.page === "leaderboardPage") {
      await loadLeaderboard();
    }
  });
});


onAuthStateChanged(auth, async user => {
  currentUser = user;
  profile = null;

  $("authPanel").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("headerStats").classList.remove("hidden");
  $("loginButton").classList.toggle("hidden", !!user);
  $("logoutButton").classList.toggle("hidden", !user);

  if (!user) {
    // Start or resume the local guest save after logout.
    profile = loadGuestProfile();

    $("accountText").textContent = "Guest";
    updateUI();
    renderInventory();
    await loadLeaderboard();
    return;
  }

  try {
    const ref = doc(db, "users", user.uid);
    const snapshot = await getDoc(ref);

    // Capture guest progress before changing the active profile.
    const guestProfile = loadGuestProfile();

    if (snapshot.exists()) {
      profile = {
        ...emptyProfile(user.email?.split("@")[0] || "Player"),
        ...snapshot.data(),
        rolls: Number(snapshot.data().rolls) || 0,
        inventory: snapshot.data().inventory || {}
      };
    } else {
      profile = emptyProfile(
        pendingSignupUsername ||
        user.email?.split("@")[0] ||
        "Player"
      );
    }

    // Merge guest progress into the account exactly once.
    const guestHasProgress =
      guestProfile.rolls > 0 ||
      Object.values(guestProfile.inventory).some(
        count => Number(count) > 0
      );

    if (guestHasProgress) {
      profile.rolls =
        (Number(profile.rolls) || 0) +
        (Number(guestProfile.rolls) || 0);

      for (const [id, count] of Object.entries(guestProfile.inventory)) {
        profile.inventory[id] =
          (Number(profile.inventory[id]) || 0) +
          (Number(count) || 0);
      }
    }

    profile.username =
      snapshot.exists()
        ? (snapshot.data().username || profile.username)
        : profile.username;

    profile.bestName = bestMember()?.name || null;
    profile.bestOdds = bestMember()?.odds || 0;

    // Save account progress before removing the guest save.
    await saveProfile();

    if (guestHasProgress) {
      localStorage.removeItem(GUEST_SAVE_KEY);
    }

    pendingSignupUsername = null;

    $("authMessage").textContent = "";
    updateUI();
    renderInventory();
    await loadLeaderboard();
  } catch (error) {
    console.error(error);

    $("authMessage").textContent =
      "Couldn't load or merge your save. Check your connection and try again.";
  }
});
</script>
